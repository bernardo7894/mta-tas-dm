name: Apply camera telemetry integration

on:
  push:
    paths:
      - .github/workflows/add-camera-telemetry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch TAS camera telemetry
        run: |
          python tools/fix_camera_patch_helper.py
          python tools/apply_camera_telemetry_patch.py

      - name: Validate Lua syntax and patch invariants
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p new/tas/client.lua
          grep -q 'save_camera = "savecamera"' new/tas/client.lua
          grep -q 'save_all = "saveall"' new/tas/client.lua
          grep -q 'mta-tas-dm-camera-jsonl' new/tas/client.lua
          grep -q 'c = camera' new/tas/client.lua

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new/tas/client.lua new/tas/PHYSICS_EXPORT.md new/tas/README.md
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: record synchronized camera telemetry"
          git push origin HEAD:master
