name: Apply recordplayback saveall integration

'on':
  push:
    paths:
      - .github/workflows/add-recordplaybacksaveall.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Patch command and updater
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('new/tas/client.lua')
          raw = p.read_bytes()
          newline = '\r\n' if b'\r\n' in raw else '\n'
          text = raw.decode('utf-8').replace('\r\n', '\n')

          def once(old, new, label):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              text = text.replace(old, new, 1)

          once(
              '\t\tplayback_recording_last_tick = nil, -- wall-clock fallback for playback capture dt on onClientRender\n',
              '\t\tplayback_recording_last_tick = nil, -- wall-clock fallback for playback capture dt on onClientRender\n\t\tplayback_recording_save_all = false, -- /recordplaybacksaveall saves TAS + physics + camera after normal completion\n',
              'playback save-all state',
          )

          once(
              '\trecord_playback = "recordplayback",\n',
              '\trecord_playback = "recordplayback",\n\trecord_playback_save_all = "recordplaybacksaveall",\n',
              'command registration',
          )

          once(
              'function tas.begin_playback_recording(name, vehicle, fresh_playback)\n\ttas.var.playback_recording = true\n',
              'function tas.begin_playback_recording(name, vehicle, fresh_playback, save_all_on_finish)\n\ttas.var.playback_recording = true\n\ttas.var.playback_recording_save_all = save_all_on_finish == true\n',
              'begin playback signature',
          )

          once(
              '\tlocal name = tas.var.playback_record_name\n\ttas.var.playback_recording = false\n\ttas.var.playback_record_name = nil\n',
              '\tlocal name = tas.var.playback_record_name\n\tlocal save_all_on_finish = tas.var.playback_recording_save_all == true\n\ttas.var.playback_recording = false\n\ttas.var.playback_record_name = nil\n\ttas.var.playback_recording_save_all = false\n',
              'finish state reset',
          )

          once(
              '\tif name then\n\t\texecuteCommandHandler(tas.registered_commands.save_analysis, name)\n\t\texecuteCommandHandler(tas.registered_commands.save_camera, name)\n\tend\n',
              '\tif name then\n\t\tif completed ~= false and save_all_on_finish then\n\t\t\texecuteCommandHandler(tas.registered_commands.save_all, name)\n\t\telse\n\t\t\texecuteCommandHandler(tas.registered_commands.save_analysis, name)\n\t\t\texecuteCommandHandler(tas.registered_commands.save_camera, name)\n\t\tend\n\tend\n',
              'finish save behavior',
          )

          once(
              '\t-- // Record a playback with fresh ground-contact probes\n\telseif cmd == tas.registered_commands.record_playback then\n',
              '\t-- // Record a playback with fresh telemetry; optionally save all outputs at normal completion\n\telseif cmd == tas.registered_commands.record_playback or cmd == tas.registered_commands.record_playback_save_all then\n\n\t\tlocal save_all_on_finish = cmd == tas.registered_commands.record_playback_save_all\n',
              'recordplayback command branch',
          )

          once(
              '\t\t\ttas.prompt("Example: $$/"..tas.registered_commands.record_playback.." run_ground", 255, 100, 100)\n',
              '\t\t\tlocal example_command = save_all_on_finish and tas.registered_commands.record_playback_save_all or tas.registered_commands.record_playback\n\t\t\ttas.prompt("Example: $$/"..example_command.." run_ground", 255, 100, 100)\n',
              'recordplayback example',
          )

          once(
              '\t\tif tas.var.playbacking then\n\t\t\ttas.begin_playback_recording(args[1], vehicle, fresh_playback)\n',
              '\t\tif tas.var.playbacking then\n\t\t\ttas.begin_playback_recording(args[1], vehicle, fresh_playback, save_all_on_finish)\n',
              'recordplayback begin call',
          )

          once(
              '\t\t\t"/"..tas.registered_commands.record_playback.." [name] $$- ##play back and capture ground-contact telemetry",\n',
              '\t\t\t"/"..tas.registered_commands.record_playback.." [name] $$- ##play back and capture physics + camera telemetry",\n\t\t\t"/"..tas.registered_commands.record_playback_save_all.." [name] $$- ##record playback, then save TAS + physics + camera when it ends",\n',
              'help text',
          )

          p.write_bytes(text.replace('\n', newline).encode('utf-8'))

          u = Path('new/tas/updater.lua')
          uraw = u.read_bytes()
          unewline = '\r\n' if b'\r\n' in uraw else '\n'
          ut = uraw.decode('utf-8').replace('\r\n', '\n')
          old_ref = 'contents/new/tas?ref=physics-analysis-export'
          old_sha = 'commits?sha=physics-analysis-export'
          if ut.count(old_ref) != 1 or ut.count(old_sha) != 1:
              raise SystemExit('updater branch anchors were not unique')
          ut = ut.replace(old_ref, 'contents/new/tas?ref=master', 1)
          ut = ut.replace(old_sha, 'commits?sha=master', 1)
          u.write_bytes(ut.replace('\n', unewline).encode('utf-8'))

          d = Path('new/tas/PHYSICS_EXPORT.md')
          dr = d.read_bytes()
          dn = '\r\n' if b'\r\n' in dr else '\n'
          dt = dr.decode('utf-8').replace('\r\n', '\n')
          needle = '- `/recordplayback <name>` refreshes both `<name>.physics.jsonl` and `<name>.camera.jsonl` from the replayed source frames.\n'
          addition = needle + '- `/recordplaybacksaveall <name>` does the same capture and, after a normal end-of-TAS, runs `/saveall <name>` so TAS + physics + camera are saved together.\n'
          if needle not in dt:
              raise SystemExit('documentation anchor not found')
          dt = dt.replace(needle, addition, 1)
          d.write_bytes(dt.replace('\n', dn).encode('utf-8'))
          PY

      - name: Validate patch
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p new/tas/client.lua
          grep -q 'record_playback_save_all = "recordplaybacksaveall"' new/tas/client.lua
          grep -q 'executeCommandHandler(tas.registered_commands.save_all, name)' new/tas/client.lua
          grep -q 'contents/new/tas?ref=master' new/tas/updater.lua
          ! grep -q 'ref=physics-analysis-export' new/tas/updater.lua

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new/tas/client.lua new/tas/updater.lua new/tas/PHYSICS_EXPORT.md
          git commit -m "feat: add recordplaybacksaveall command"
          git push origin master
